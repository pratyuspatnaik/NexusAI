<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom — Domain-Adaptive AI Orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="side">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="tabs" id="tabs" aria-label="Workflow stages"></nav>
  </div>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Project sidebar">
    <div class="side-content" id="sideContent"></div>
    <div class="side-footer">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><span class="theme-icon" aria-hidden="true">☀︎</span></button>
      <div class="account-summary">
        <div class="avatar" title="Riya Sharma">RS</div>
        <span>Riya Sharma</span>
      </div>
    </div>
  </aside>
  <button class="side-backdrop" id="sideBackdrop" type="button" aria-label="Close sidebar" hidden></button>
  <main id="view" tabindex="-1"></main>
</div>
<div class="modal-wrap" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
