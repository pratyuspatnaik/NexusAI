<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom — Domain-Adaptive AI Orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Loom</div>
    <label class="proj-pick">
      <span class="sr">Project</span>
      <select id="projectSelect" aria-label="Project"></select>
    </label>
    <div class="top-right">
      <button class="icon-btn" id="bell" aria-label="Notifications">Alerts<span class="dot" id="bellDot" hidden></span></button>
      <div class="avatar" title="Riya Sharma">RS</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Workflow stages"></nav>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="view" tabindex="-1"></main>
</div>
<div class="modal-wrap" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
